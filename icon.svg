<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="WalkHome">
  <title>WalkHome</title>
  <!--
    The product in one glyph: a walk that steps around the block it would
    otherwise have crossed, and arrives at a door.

    The warm square is a block scoring high at this hour, taken from the same
    ramp the map uses. The cool line is the route, the same hue as the route on
    the map and 160 degrees off every step of that ramp, so the two can never be
    read as the same quantity. The line hugs the block on two sides on purpose:
    that adjacency is what makes it read as avoidance rather than decoration.

    The roof is kept to 40% of the house and the body is flanked wider than the
    stroke, because at an even split the silhouette reads as an upward arrow
    instead of a building. The doorway is punched in the tile colour so the walk
    visibly ends inside it.
  -->
  <rect width="32" height="32" rx="7" fill="#0b1a24"/>

  <!-- two cross-streets: enough to say "grid", few enough to stay clean small -->
  <g stroke="#dfe7ea" stroke-opacity=".09" stroke-width="1">
    <path d="M0 22h32M4 0v32"/>
  </g>

  <!-- the block the route refuses -->
  <rect x="8.5" y="7" width="7" height="7" rx="1.7" fill="#d87321"/>

  <!-- the walk: up, across under the block, then up past its far side -->
  <path d="M8 26.4V17.8H21V10.4" fill="none" stroke="#35c8ff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- where you start -->
  <circle cx="8" cy="26.4" r="2.8" fill="#35c8ff"/>

  <!-- and home, with the walk ending in the doorway -->
  <path d="M21 5L25.2 8.6V12.6H16.8V8.6Z" fill="#35c8ff"/>
  <rect x="19.2" y="9.5" width="3.6" height="3.1" rx="0.5" fill="#0b1a24"/>
</svg>
