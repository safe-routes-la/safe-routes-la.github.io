<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="WalkHome">
  <title>WalkHome</title>
  <!--
    A walk that goes around the block it would have crossed and stops at a
    door. Ink tile, white walk, one warm block from the map's risk ramp. The
    walk stops short of the house so the two never fuse into an arrow, and the
    house is wider than the line, with a door, so it reads as a building.
  -->
  <rect width="32" height="32" rx="7.5" fill="#0e0f12"/>
  <rect x="7.5" y="8.5" width="9" height="9" rx="2" fill="#dc7426"/>
  <path d="M7 24.5H22V17.5" fill="none" stroke="#fff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="7" cy="24.5" r="2.6" fill="#fff"/>
  <path d="M22 5L26.8 9.2V14.2H17.2V9.2Z" fill="#fff"/>
  <rect x="20.7" y="10.8" width="2.6" height="3.4" rx=".4" fill="#0e0f12"/>
</svg>
